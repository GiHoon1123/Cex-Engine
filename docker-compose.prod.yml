# =====================================================
# 프로덕션 배포용 Docker Compose 설정
# =====================================================
# 엔진 지연 편차를 줄이기 위한 실행 설정
# - 코어 0 고정
# - 실시간 스케줄링 (cap_add: SYS_NICE)
# - 우선순위 99 (애플리케이션 내부 설정)
# =====================================================

services:
  cex-engine:
    build: .
    image: cex-engine:local
    container_name: cex-engine
    
    # 환경 변수
    environment:
      - RUST_LOG=info
      # 운영 비밀 저장소가 모든 값을 주입하며 기본 자격 증명은 허용하지 않는다.
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL이 필요합니다}
      - ENGINE_SERVICE_TOKEN=${ENGINE_SERVICE_TOKEN:?ENGINE_SERVICE_TOKEN이 필요합니다}
      - ENGINE_AUDIT_TOKEN=${ENGINE_AUDIT_TOKEN:?ENGINE_AUDIT_TOKEN이 필요합니다}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS가 필요합니다}
      - ENGINE_HTTP_ADDRESS=0.0.0.0:3002
      - ENGINE_DATA_DIR=/app/data
    
    # 엔진은 플랫폼만 호출한다. 호스트 포트를 열지 않고 내부 네트워크에서만 노출한다.
    expose:
      - "3002"
    
    # =====================================================
    # 성능 극대화 설정 (필수)
    # =====================================================
    
    # 코어 0에서만 실행되도록 제한한다. 호스트의 다른 작업까지 배제하는 설정은 아니다.
    cpuset: "0"
    
    # 실시간 스케줄링 권한
    # SCHED_FIFO 우선순위 99 설정을 위해 필요
    cap_add:
      - SYS_NICE
    
    # 리소스 제한 (Core 0 전용)
    deploy:
      resources:
        limits:
          cpus: '1'  # 코어 0만 사용한다.
          memory: 1.5G
        reservations:
          cpus: '1'  # 코어 하나의 용량을 예약한다.
          memory: 512M
    
    # =====================================================
    # 운영 설정
    # =====================================================
    
    # 재시작 정책
    restart: unless-stopped
    
    # 헬스체크
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    
    # 로그 설정
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    volumes:
      - engine-data:/app/data

volumes:
  engine-data:

