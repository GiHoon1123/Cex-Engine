[package]
name = "cex-engine"
version = "0.1.0"
edition = "2021"

[features]
bench_mode = []

[dependencies]
axum = "0.7"
tokio = { version = "1.35", features = ["full"] }
tower = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 엔진 전용 저널의 부분 쓰기·커밋·복구는 검증된 저장 엔진에 맡긴다.
rusqlite = { version = "0.40.2", features = ["bundled"] }

# HTTP Client (axios 같은 역할)
reqwest = { version = "0.11", features = ["json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# OpenAPI/Swagger documentation
utoipa = { version = "4.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }

# Solana client (RPC 통신용)
solana-client = "1.18"
solana-sdk = "1.18"
anchor-client = "0.30"
anchor-lang = "0.30"

# Database (PostgreSQL)
sqlx = { version = "0.6", default-features = false, features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid", "macros", "migrate", "decimal"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
rust_decimal = { version = "1.33", features = ["serde-with-str"] }  # For precise decimal calculations (orders, balances)
# 이미 Cargo.lock에 있는 0.4 계열을 직접 사용한다. 체결 곱의 중간 결과가
# Decimal 범위를 넘더라도 반올림 없이 검사하고, 최종 값만 정확히 변환한다.
num-bigint = "0.4.6"

# Base64 encoding (for private key storage)
base64 = "0.21"

# High-performance channels (Lock-free Ring Buffer)
crossbeam = "0.8"

# Async trait (for Engine trait)
async-trait = "0.1"

# CPU 코어 고정
core_affinity = "0.8"

# 실시간 스케줄링 (Linux only)
nix = { version = "0.27", features = ["sched"] }
libc = "0.2"  # 실시간 스케줄링용 (sched_setscheduler)

# 벤치마크 (TPS 측정)
criterion = { version = "0.5", features = ["html_reports"] }

# 동시 요청 회귀 테스트에서 사용하는 비동기 작업 모음이다.
futures-util = "0.3"

# Kafka (이벤트 발행용)
rdkafka = { version = "0.36", features = ["cmake-build", "ssl-vendored"] }

[dev-dependencies]
# 이미 잠금 파일에 있는 임시 디렉터리 도구로 시험 저널을 자동 회수한다.
tempfile = "=3.24.0"
# 이미 사용하는 Tower의 테스트 유틸리티를 활성화한다.
# `oneshot`으로 포트를 열지 않고 실제 Axum 라우터에 요청을 보낼 수 있다.
tower = { version = "0.4", features = ["util"] }

[[bench]]
name = "tps_benchmark"
harness = false
required-features = ["bench_mode"]

